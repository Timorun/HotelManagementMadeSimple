name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/hmms

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hotel_user
          POSTGRES_PASSWORD: welkom
          POSTGRES_DB: hotel_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hotel_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B clean package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hmms-jar
          path: backend/hmms/target/*.jar
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/hmms

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/hmms/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

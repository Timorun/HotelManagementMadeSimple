spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    show-sql: false
  flyway:
    locations: classpath:db/migration

hmms:
  cors:
    allowed-origins: ${HMMS_CORS_ALLOWED_ORIGINS}
  auth:
    cookie-secure: true
    cookie-same-site: None
    bootstrap-admin:
      password: ${HMMS_BOOTSTRAP_ADMIN_PASSWORD}
  public:
    base-url: ${HMMS_PUBLIC_BASE_URL}
    token-secret: ${HMMS_PUBLIC_TOKEN_SECRET}
